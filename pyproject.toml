[project]
name = "ai-resume-screening-pipeline"
version = "0.1.0"
description = "Resume screening & ranking: LLM as witness, code as judge."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pypdf>=4.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",  # PyMuPDF import noise
    "ignore:Using `httpx` with `starlette.testclient`",
]
